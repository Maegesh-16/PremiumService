services:
  - type: web
    name: insurance-premium-service
    runtime: docker
    rootDir: Backend/Premium-ServiceAPI
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ConnectionStrings__PremiumServiceDb
        sync: false
      - key: JwtSettings__Issuer
        value: InsurancePlatform.Identity
      - key: JwtSettings__Audience
        value: insurancePlatform.Clients
      - key: JwtSettings__SecretKey
        sync: false
      - key: JwtSettings__ValidateIssuer
        value: "true"
      - key: JwtSettings__ValidateAudience
        value: "true"
      - key: JwtSettings__ValidateLifetime
        value: "true"
      - key: JwtSettings__ValidateIssuerSigningKey
        value: "true"
      - key: JwtSettings__ClockSkewMinutes
        value: "5"
      - key: AppUrls__PublicBaseUrl
        sync: false